apiVersion: batch/v1
kind: CronJob
metadata:
  name: planet-gossip
  namespace: planets
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: planet-gossip
        spec:
          nodeSelector: {}
          restartPolicy: OnFailure
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
          containers:
            - name: planet-gossip
              image: md68/planet-node
              command: ["python", "-m", "app.gossip"]
              envFrom:
                - configMapRef:
                    name: planet-config
              