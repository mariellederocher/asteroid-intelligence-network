apiVersion: batch/v1
kind: CronJob
metadata:
  name: planet-gossip
  namespace: planets
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: planet-gossip
        spec:
          nodeSelector:
            planet: earth
          restartPolicy: OnFailure
          containers:
            - name: planet-gossip
              image: planet-node:latest
              imagePullPolicy: Never
              command: ["python", "-m", "app.gossip"]
              env:
                - name: CONFIG_PATH
                  value: "/config/planets.yaml"
              volumeMounts:
                - name: planet-config
                  mountPath: /config
          volumes:
            - name: planet-config
              configMap:
                name: planet-config
                items:
                  - key: planets.yaml
                    path: planets.yaml
