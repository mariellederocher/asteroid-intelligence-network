apiVersion: apps/v1
kind: Deployment
metadata:
  name: planet-jupiter
  namespace: planets
  labels:
    app: planet-node
    planet: jupiter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planet-node
      planet: jupiter
  template:
    metadata:
      labels:
        app: planet-node
        planet: jupiter
    spec:
      containers:
        - name: planet-jupiter
          image: ghcr.io/mariellederocher/planet-node:latest
          imagePullPolicy: Always
          env:
            - name: PLANET_NAME
              value: jupiter
            - name: DETECTION_RANGE
              valueFrom:
                configMapKeyRef:
                  name: planet-config
                  key: JUPITER_RANGE
          ports:
            - containerPort: 8000