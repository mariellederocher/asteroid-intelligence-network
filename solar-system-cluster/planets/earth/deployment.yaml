apiVersion: apps/v1
kind: Deployment
metadata:
  name: planet-earth
  namespace: planets
  labels: 
    app: planet-node
    planet: earth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planet-node
      planet: earth
  template:
    metadata: 
      labels:
        app: planet-node
        planet: earth
    spec: 
      containers:
        - name: planet-earth
          image: ghcr.io/mariellederocher/planet-node:latest
          imagePullPolicy: Always
          env:
            - name: PLANET_NAME
              value: "earth"
            - name: DETECTION_RANGE
              valueFrom:
                configMapKeyRef:
                  name: planet-config
                  key: EARTH_RANGE
          ports:
            - containerPort: 8000