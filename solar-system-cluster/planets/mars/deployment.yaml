apiVersion: apps/v1
kind: Deployment
metadata:
  name: planet-mars
  namespace: planets
  labels: 
    app: planet-node
    planet: mars
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planet-node
      planet: mars
  template:
    metadata: 
      labels:
        app: planet-node
        planet: mars
    spec: 
      containers:
        - name: planet-mars
          image: ghcr.io/mariellederocher/planet-node:latest
          imagePullPolicy: Always
          env:
            - name: PLANET_NAME
              value: "mars"
            - name: DETECTION_RANGE
              valueFrom:
                configMapKeyRef:
                  name: planet-config
                  key: MARS_RANGE
          ports:
            - containerPort: 8000