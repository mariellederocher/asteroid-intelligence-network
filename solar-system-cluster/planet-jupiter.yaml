apiVersion: apps/v1
kind: Deployment
metadata:
  name: planet-jupiter
  namespace: planets
  labels:
    app: planet-jupiter 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planet-jupiter
  template:
    metadata:
      labels:
        app: planet-jupiter
    spec:
      containers:
        - name: planet-node
          image: md68/planet-node
          ports:
            - containerPort: 8000
          env:
            - name: PLANET_NAME
              value: "jupiter"
          envFrom:
            - configMapRef:
                name: planet-config
