apiVersion: batchv1
kind: CronJob
metadata:
  name: planet-gossip
  namespace: planets
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec: 
          containers:
            - name: gossip
              image: ghcr.io/mariellederocher/planet-node:latest
              args: ["gossip"]
              envFrom:
                - configMapRef:
                    name: planet-config
          restartPolicy: OnFailure